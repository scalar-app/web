name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      # @scalar/ui and @scalar/sdk are linked from sibling checkouts until they are published.
      - uses: actions/checkout@v4
        with:
          path: web
      # Which branch of each sibling to read.
      #
      # This job used to read the sibling's default branch whatever branch it was
      # running for, so a change spanning two repositories was tested against half
      # of itself: the Gmail work failed `pnpm lint` here with "unsafe assignment of
      # an error typed value", which was `@scalar/integrations` on main not yet
      # exporting what this branch imports. That reads as a type error in code that
      # is fine.
      #
      # Each sibling is resolved on its own -- the branch of the same name where it
      # exists, the default branch where it does not -- so a feature that touches
      # one sibling is not held to having a branch in all of them, and an ordinary
      # single-repository change is unaffected.
      - id: sibling
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          sibling_ref() {
            if git ls-remote --exit-code --heads \
                 "https://github.com/scalar-app/$1" "$BRANCH" >/dev/null 2>&1; then
              echo "$BRANCH"
            else
              echo ""
            fi
          }
          echo "ui=$(sibling_ref ui)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(sibling_ref sdk)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: scalar-app/ui
          path: ui
          ref: ${{ steps.sibling.outputs.ui }}
      - uses: actions/checkout@v4
        with:
          repository: scalar-app/sdk
          path: sdk
          ref: ${{ steps.sibling.outputs.sdk }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            ui/pnpm-lock.yaml
            sdk/pnpm-lock.yaml
      - name: Build linked packages
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      # After the build, because these run against `next start` rather than the dev server: what
      # is checked is what somebody would load.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:visual
        working-directory: web
      # Carries the rail as a PNG on every run, and the failure screenshots when there are any.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
